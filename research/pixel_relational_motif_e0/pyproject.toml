[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel_relational_motif_e0"
version = "0.1.0"
description = "PGM E0: pixel-relational motif existence and validation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
m0 = ["torch>=2.2.0,<3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
