inherits:
  - ../d13b/d13b_k144_m16_deep_readout.yaml

run_name: d13c_m16_ce_continue

run:
  config_name: d13c_m16_ce_continue
  seed: 1

paths:
  output_root: outputs/d13c_diagnostic

environments:
  local:
    paths:
      csv_root: data
      graph_repo_path: artifacts/graph-repo/graph_repo
      output_root: outputs/d13c_diagnostic
  kaggle:
    paths:
      csv_root: auto
      graph_repo_path: /kaggle/working/artifacts/graph_repo
      output_root: /kaggle/working/outputs/d13c_diagnostic

model:
  name: d13c_supcon_diagnostic
  base_model: d13b_k144_m16_deep_readout
  init_d13b_checkpoint: outputs/d13b_diagnostic/d13b_k144_m16_deep_readout/checkpoints/best.pt
  num_slots: 16
  slot_arch: deep_readout
  slot_iters: 3
  slot_self_attention_layers: 1
  slot_readout: self_attention_attention_pool
  projection_dim: 64
  projection_hidden_dim: 128
  freeze_backbone: false
  prototype_weight: 0.0
  motif_level_supcon: false

loss:
  name: d13c_diagnostic
  lambda_supcon: 0.0
  supcon_temperature: 0.1
  prototype_weight: 0.0
  motif_level_supcon: false

training:
  seed: 1
  epochs: 30
  max_epochs: 30
  batch_size: 16
  grad_clip: 1.0
  amp: false

data:
  batch_size: 16

scheduler:
  t_max: 30
