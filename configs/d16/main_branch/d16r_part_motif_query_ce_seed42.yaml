run_name: d16r_part_motif_query_ce_seed42
seed: 42
from_scratch: true
init_checkpoint: null

data:
  use_mediapipe_priors: true
  prior_dir: outputs/d16_mediapipe_pixel_priors_best_retry_rescue
  graph_cache_dir: null
  graph_mode: face_plus_context
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

graph:
  graph_mode: face_plus_context
  face_threshold: 0.15
  context_pixels: 2

model:
  name: d16_landmark_aware_pixel_evidence_gnn
  architecture: single_path
  hidden_dim: 96
  gnn_layers: 3
  num_classes: 7
  dropout: 0.1
  dual_head: false
  readout_type: part_motif_query
  part_motif_query:
    motif_counts:
      mouth: 3
      eye: 3
      brow: 3
      nose_cheek: 1
      global: 2
    lambda_part: 1.0
    eps: 1.0e-6
    use_cls_token: true
    use_motif_type_embedding: true
    transformer_layers: 1
    transformer_heads: 4
    mlp_ratio: 2.0
    dropout: 0.2
    residual_concat: true
    diagnostics: true

loss:
  mode: ce_only
  part_supcon_weight: 0.0
  fallback_weighted: false
  fallback_weight: 1.0

training:
  seed: 42
  max_epochs: 150
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.0001
  eval_every_epoch: true
  save_best: true
  final_test_checkpoint: best
  progress_interval_batches: 500
  from_scratch: true
  init_checkpoint: null
  early_stopping:
    enabled: true
    min_epochs_before_stop: 60
    patience: 30
    metric: val_macro_f1
    mode: max

logging:
  metrics:
    - train_loss
    - ce_loss
    - val_macro_f1
    - val_accuracy
    - test_from_best_pt
    - pred_count
    - per_class_f1
    - detected_vs_fallback
    - part_motif_summary
    - predictions
    - confusion_matrix
