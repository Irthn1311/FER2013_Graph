run_name: d16_v0_face_plus_context_ce_small
from_scratch: true
init_checkpoint: null

data:
  use_mediapipe_priors: true
  prior_dir: outputs/d16_mediapipe_pixel_priors_best
  graph_cache_dir: null
  graph_mode: face_plus_context
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  max_train_samples: 1024
  max_val_samples: 512
  max_test_samples: 512

graph:
  graph_mode: face_plus_context
  face_threshold: 0.15
  context_pixels: 2

model:
  name: d16_landmark_aware_pixel_evidence_gnn
  hidden_dim: 96
  gnn_layers: 3
  num_classes: 7
  dropout: 0.1

loss:
  mode: ce_only
  part_supcon_weight: 0.0

training:
  max_epochs: 30
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.0001
  eval_every_epoch: true
  save_best: true
  early_stopping: false
  early_stopping_patience: 999
  from_scratch: true
  init_checkpoint: null
