run_name: d16_v4_detected_face_fallback_grid12_ce
seed: 42
from_scratch: true
init_checkpoint: null

data:
  use_mediapipe_priors: true
  prior_dir: outputs/d16_mediapipe_pixel_priors_best
  graph_cache_dir: null
  graph_mode: face_plus_context
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

graph:
  graph_mode: face_plus_context
  face_threshold: 0.15
  context_pixels: 2

model:
  name: d16_routed_detected_face_fallback_patch
  architecture: routed_fallback_patch
  hidden_dim: 96
  gnn_layers: 3
  num_classes: 7
  dropout: 0.1

fallback_encoder:
  type: grid_gnn
  patch_size: 4
  grid_size: 12
  gnn_layers: 2

loss:
  mode: ce_only
  fallback_weighted: false
  fallback_weight: 1.0

training:
  seed: 42
  max_epochs: 150
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.0001
  eval_every_epoch: true
  save_best: true
  final_test_checkpoint: best
  progress_interval_batches: 500
  from_scratch: true
  init_checkpoint: null
  early_stopping:
    enabled: true
    min_epochs_before_stop: 60
    patience: 30
    metric: val_macro_f1
    mode: max

logging:
  metrics:
    - train_loss
    - ce_loss
    - detected_loss_mean
    - fallback_loss_mean
    - detected_path_count
    - fallback_path_count
    - fallback_token_count_mean
    - val_macro_f1
    - val_accuracy
    - detected_vs_fallback
    - routed_path
    - predictions
    - confusion_matrix
