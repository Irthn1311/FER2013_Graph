run_name: d16_v1_face_plus_context_class_weighted_ce
from_scratch: true
init_checkpoint: null

data:
  use_mediapipe_priors: true
  prior_dir: outputs/d16_mediapipe_pixel_priors_best
  graph_cache_dir: null
  graph_mode: face_plus_context
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

graph:
  graph_mode: face_plus_context
  face_threshold: 0.15
  context_pixels: 2

model:
  name: d16_landmark_aware_pixel_evidence_gnn
  hidden_dim: 96
  gnn_layers: 3
  num_classes: 7
  dropout: 0.1

loss:
  mode: class_weighted_ce
  class_weights_auto: false
  # Inverse-frequency weights from outputs/d16_mediapipe_pixel_priors_best/train,
  # normalized to mean 1.0 for classes [Angry, Disgust, Fear, Happy, Sad, Surprise, Neutral].
  class_weights:
    - 0.48000225440675315
    - 4.398185794392154
    - 0.4680519908115643
    - 0.2657808740616741
    - 0.39702049821014057
    - 0.6047332091942539
    - 0.38622537892346

training:
  max_epochs: 150
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.0001
  eval_every_epoch: true
  save_best: true
  final_test_checkpoint: best
  progress_interval_batches: 500
  from_scratch: true
  init_checkpoint: null
  early_stopping:
    enabled: true
    min_epochs_before_stop: 60
    patience: 30
    metric: val_macro_f1
    mode: max

logging:
  metrics:
    - train_loss
    - ce_loss
    - sample_weight_mean
    - val_macro_f1
    - val_accuracy
    - detected_vs_fallback
    - predictions
    - confusion_matrix

