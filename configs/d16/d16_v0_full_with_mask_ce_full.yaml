run_name: d16_v0_full_with_mask_ce_full
from_scratch: true
init_checkpoint: null

data:
  use_mediapipe_priors: true
  prior_dir: outputs/d16_mediapipe_pixel_priors_best
  graph_mode: full_with_mask
  batch_size: 8
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

graph:
  graph_mode: full_with_mask
  face_threshold: 0.15
  context_pixels: 0

model:
  name: d16_landmark_aware_pixel_evidence_gnn
  hidden_dim: 96
  gnn_layers: 3
  num_classes: 7
  dropout: 0.1

loss:
  mode: ce_only
  part_supcon_weight: 0.0

training:
  max_epochs: 150
  batch_size: 8
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.0001
  eval_every_epoch: true
  save_best: true
  final_test_checkpoint: best
  from_scratch: true
  init_checkpoint: null
  early_stopping:
    enabled: true
    min_epochs_before_stop: 60
    patience: 30
    metric: val_macro_f1
    mode: max

logging:
  metrics:
    - train_loss
    - val_macro_f1
    - val_accuracy
    - test_from_best_pt
    - pred_count
    - per_class_f1
    - detected_vs_fallback
    - runtime
    - memory
