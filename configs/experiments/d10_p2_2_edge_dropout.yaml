# Phase 2: Edge Dropout Regularization
inherits:
  - d10_v3_2_cosine_only.yaml

experiment:
  name: d10_p2_2_edge_dropout

paths:
  resolved_output_root: output/d10_p2_2_edge_dropout

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p2_2_edge_dropout

model:
  edge_dropout_p: 0.1

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 80
  min_lr: 0.000001

training:
  epochs: 80
