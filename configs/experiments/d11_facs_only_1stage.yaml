run:
  config_name: d11_facs_only_1stage
  output_root: outputs/d11_experiments
  seed: 42
  use_wandb: true
data:
  batch_size: 128
  num_workers: 4
model:
  name: d11_global_local_model
  hidden_dim: 128
  num_slots: 8
  slot_iters: 3
  use_global_branch: false
loss:
  name: d11_global_local_loss
  lambda_local: 0.5
  lambda_spatial: 1.0
  label_smoothing: 0.1
optimizer:
  name: adamw
  lr: 0.0002
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
scheduler:
  name: cosine
  t_max: 80
  eta_min: 1.0e-05
trainer:
  epochs: 80
  val_frequency: 1
  amp: true
  multi_gpu: true
  checkpoint_monitor: val_macro_f1
  checkpoint_mode: max
  use_compile: true
graph:
  chunk_aware_shuffle: true
  chunk_cache_size: 8
