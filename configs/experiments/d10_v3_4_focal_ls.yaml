# D10 V3.4 — Focal Loss Extension
inherits:
  - d10_v2_2_iter5_lr3e4.yaml

experiment:
  name: d10_v3_4_focal_ls

paths:
  resolved_output_root: output/d10_v3_4_focal_ls

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_v3_4_focal_ls

loss:
  focal_gamma: 2.0
  label_smoothing: 0.1

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 120
  min_lr: 0.000001

training:
  epochs: 120
