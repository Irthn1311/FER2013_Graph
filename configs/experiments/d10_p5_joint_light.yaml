# Joint Light SupCon: CE chủ đạo, SupCon chỉ hỗ trợ nhẹ
# Mục đích: Test xem SupCon=0.1 (thay vì 0.3) có cân bằng hơn không
inherits:
  - d10_p2_1_multiscale.yaml

experiment:
  name: d10_p5_joint_light

paths:
  resolved_output_root: output/d10_p5_joint_light

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_joint_light

model:
  slot_iterations: 5
  use_position_encoding: false
  multi_scale_gnn: true
  residual_slot_connection: true
  use_slot_refinement: true
  freeze_classifier: false
  freeze_encoder: false
  dropout: 0.3

loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.1         # Nhẹ hơn (Joint dùng 0.3) - CE chiếm ưu thế
  supcon_temperature: 0.07
  lambda_slot_div: 0.03      # Nhẹ hơn Joint (0.05)
  lambda_slot_balance: 0.005
  label_smoothing: 0.05

optimizer:
  weight_decay: 0.001

training:
  epochs: 80
  early_stopping_patience: 25
  val_frequency: 3
  monitor: val_macro_f1
  use_compile: false

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 80
  min_lr: 0.000001

checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max

early_stopping:
  monitor: val_macro_f1
  mode: max
