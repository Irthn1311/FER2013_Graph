# Phase 5 Stage 2: Semantic Relation Learning (Anti-Overfitting + Hard Class)
inherits:
  - d10_p5_stage1_supcon.yaml

experiment:
  name: d10_p5_stage2_relation

paths:
  resolved_output_root: output/d10_p5_stage2_relation

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_stage2_relation

model:
  freeze_classifier: false
  freeze_encoder: true       # Keep frozen: Stage 1 now produces good motifs
  dropout: 0.4               # Anti-overfitting (was 0.2)

loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.0
  label_smoothing: 0.1       # Anti-overfitting
  focal_gamma: 2.0           # Focus on hard classes (Fear, Sad, Angry)
  class_weight_power: 0.5    # Boost minority classes more (was 0.25)

optimizer:
  weight_decay: 0.01          # Anti-overfitting (was 0.0001)

training:
  epochs: 60                  # Reduced from 120 (was overfitting after ep60)
  early_stopping_patience: 20
  monitor: val_macro_f1
  val_frequency: 3

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 60                   # Match epochs
  min_lr: 0.000001

checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max

early_stopping:
  monitor: val_macro_f1
  mode: max
