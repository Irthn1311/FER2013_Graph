# Phase 5 Stage 2: Semantic Relation Learning (Balanced Regularization)
# freeze_encoder: false + light anti-overfitting
inherits:
  - d10_p5_stage1_supcon.yaml

experiment:
  name: d10_p5_stage2_relation

paths:
  resolved_output_root: output/d10_p5_stage2_relation

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_stage2_relation

model:
  freeze_classifier: false
  freeze_encoder: false       # MUST be false - Stage 1 motifs not good enough to freeze
  dropout: 0.3                # Light regularization (Run1=0.2 overfit, Run2=0.4 underfit)

loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.0
  label_smoothing: 0.05       # Light smoothing (Run2=0.1 was too aggressive)

optimizer:
  weight_decay: 0.001         # Moderate (Run1=0.0001 too low, Run2=0.01 too high)

training:
  epochs: 80                  # Run1 peaked at ep108, give it room
  early_stopping_patience: 25
  monitor: val_macro_f1
  val_frequency: 3

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 80
  min_lr: 0.000001

checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max

early_stopping:
  monitor: val_macro_f1
  mode: max
