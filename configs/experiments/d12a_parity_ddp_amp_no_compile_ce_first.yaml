inherits:
  - d12a_stable_ce_first.yaml

run:
  config_name: d12a_parity_ddp_amp_no_compile_ce_first

runtime_parity:
  mode: ddp_amp_no_compile

model:
  use_global_branch: true
  encoder:
    use_scale2: true
  slot_iterations: 3
  residual_slot_connection: false

loss:
  class_weight_power: 0.25
  label_smoothing: 0.05
  lambda_supcon: 0.0
  lambda_div: 0.0
  lambda_spatial: 0.0
  ce_warmup_epochs: 0

training:
  epochs: 30
  batch_size: 64
  early_stopping_patience: 15
  amp: true
  use_compile: false
  torch_compile: false
  multi_gpu: false

early_stopping:
  patience: 15

ddp:
  enabled: true
  backend: nccl
  find_unused_parameters: true
  rank0_full_validation: true
  compile: false

data:
  batch_size: 64
  num_workers: 2
  chunk_cache_size: 4
  graph_cache_chunks: 4
  ddp_chunk_aware: true
  fixed_batch_size: true
  drop_incomplete_batches: true
  carry_over_leftovers: true
  ddp_drop_last_batches: true
  chunk_aware_shuffle: false
