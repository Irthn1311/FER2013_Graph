# D10 V3.6 — Width Test (Dim 128)
inherits:
  - d10_v2_2_iter5_lr3e4.yaml

experiment:
  name: d10_v3_6_dim128

paths:
  resolved_output_root: output/d10_v3_6_dim128

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_v3_6_dim128

model:
  hidden_dim: 128
  num_gnn_layers: 2
  dropout: 0.2

loss:
  label_smoothing: 0.1

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 120
  min_lr: 0.000001

training:
  epochs: 120
