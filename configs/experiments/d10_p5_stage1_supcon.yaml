# Phase 5 Stage 1: Motif Concept Sculpting (Per-Slot SupCon + Slot Diversity)
inherits:
  - d10_p2_1_multiscale.yaml

experiment:
  name: d10_p5_stage1_supcon

paths:
  resolved_output_root: output/d10_p5_stage1_supcon

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_stage1_supcon

model:
  slot_iterations: 5
  use_position_encoding: false
  multi_scale_gnn: true
  residual_slot_connection: true
  use_slot_refinement: true
  freeze_classifier: true

loss:
  lambda_cls: 0.0          # Disable CrossEntropy
  lambda_aux_ce: 0.0       # Disable Aux CrossEntropy
  lambda_supcon: 1.0       # Enable Per-Slot SupCon
  supcon_temperature: 0.07  # Sharper clustering (was 0.1)
  lambda_slot_div: 0.1     # CRITICAL: prevent slot collapse
  lambda_slot_balance: 0.01 # Balanced slot areas

training:
  epochs: 80               # Reduced from 120 for speed
  early_stopping_patience: 25
  val_frequency: 5          # Validate every 5 epochs for speed

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 80                 # Match epochs
  min_lr: 0.000001

checkpoint:
  save_best_metric: val_loss
  save_best_mode: min

early_stopping:
  monitor: val_loss
  mode: min
