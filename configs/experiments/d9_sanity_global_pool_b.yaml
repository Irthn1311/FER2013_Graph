experiment:
  name: d9_sanity_global_pool_b

task_type: classification

paths:
  graph_repo_path: artifacts/graph_repo
  resolved_output_root: outputs/d9_sanity_global_pool_b

output:
  dir: outputs/d9_sanity_global_pool_b

data:
  graph_repo_path: artifacts/graph_repo
  num_classes: 7
  batch_size: 32
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
  chunk_cache_size: 4

feature_ablation:
  enabled: true
  original_node_dim: 7
  original_edge_dim: 5
  node_indices: [0, 1, 2]
  edge_indices: [0, 1, 2, 3, 4]

model:
  name: d9_sanity_global_pool_classifier
  node_dim: 3
  edge_dim: 5
  hidden_dim: 64
  num_classes: 7
  dropout: 0.2

training:
  device: auto
  seed: 42
  epochs: 10
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: warmup_cosine
  warmup_epochs: 2
  min_lr: 0.000001
  amp: true
  grad_clip_norm: 1.0
  class_weights: true
  val_every: 1

loss:
  cls_loss: cross_entropy
  use_class_weights: true
  class_weight_power: 1.0
  max_class_weight: 4.0
  motif_aux_weight: 0.0

checkpoint:
  monitor: val_macro_f1
  mode: max

early_stopping:
  enabled: false
  monitor: val_macro_f1
  mode: max

logging:
  log_interval: 20
  save_confusion_matrix: true
  use_wandb: false

environments:
  local:
    paths:
      graph_repo_path: artifacts/graph_repo
      resolved_output_root: outputs/d9_sanity_global_pool_b
    data:
      graph_repo_path: artifacts/graph_repo
      batch_size: 32
      num_workers: 0
      pin_memory: false
      persistent_workers: false
      prefetch_factor: null
