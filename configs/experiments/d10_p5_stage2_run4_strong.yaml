# Run 4 Slot 2: Stronger regularization trên nền Run 1 checkpoint
# Dùng checkpoint Stage 1 CŨ (mean-pooled SupCon từ Run 1)
inherits:
  - d10_p5_stage1_supcon.yaml

experiment:
  name: d10_p5_stage2_run4_strong

paths:
  resolved_output_root: output/d10_p5_stage2_run4_strong

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_stage2_run4_strong

model:
  freeze_classifier: false
  freeze_encoder: false
  dropout: 0.30

loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.0
  label_smoothing: 0.08

optimizer:
  weight_decay: 0.001

training:
  epochs: 80
  early_stopping_patience: 30
  monitor: val_macro_f1
  val_frequency: 3

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 80
  min_lr: 0.000001

checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max

early_stopping:
  monitor: val_macro_f1
  mode: max
