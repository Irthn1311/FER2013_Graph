# Final Stage 2: Fine-Tuning có kiểm soát chống nhãn nhiễu
inherits:
  - d10_final_stage1_supcon.yaml

experiment:
  name: d10_final_stage2_finetune

paths:
  resolved_output_root: output/d10_final_stage2_finetune

environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_final_stage2_finetune
    training:
      batch_size: 64

model:
  freeze_classifier: false
  freeze_encoder: false       # KHÔNG ĐÓNG BĂNG, train toàn mạng
  dropout: 0.3                # Dropout vừa phải, không làm underfit

loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.0          # Tắt SupCon
  label_smoothing: 0.05       # Chống nhãn nhiễu (Label Ambiguity)
  lambda_slot_div: 0.1
  lambda_slot_balance: 0.01

optimizer:
  weight_decay: 0.01          # L2 Regularization chống Overfit

training:
  epochs: 80
  early_stopping_patience: 25
  val_frequency: 3
  monitor: val_macro_f1

checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max

early_stopping:
  monitor: val_macro_f1
  mode: max
