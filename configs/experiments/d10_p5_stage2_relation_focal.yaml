# Stage 2 Focal variant: Higher focal gamma for even harder class focus
inherits:
  - d10_p5_stage1_supcon_focal.yaml
experiment:
  name: d10_p5_stage2_relation_focal
paths:
  resolved_output_root: output/d10_p5_stage2_relation_focal
environments:
  kaggle:
    paths:
      resolved_output_root: /kaggle/working/outputs/d10_p5_stage2_relation_focal
model:
  freeze_classifier: false
  freeze_encoder: true
  dropout: 0.4
loss:
  lambda_cls: 1.0
  lambda_aux_ce: 0.3
  lambda_supcon: 0.0
  focal_gamma: 3.0           # Even stronger focus on hard samples (base uses 2.0)
  label_smoothing: 0.1
  class_weight_power: 0.5
optimizer:
  weight_decay: 0.01
training:
  epochs: 60
  early_stopping_patience: 20
  monitor: val_macro_f1
  val_frequency: 3
scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  t_max: 60
  min_lr: 0.000001
checkpoint:
  save_best_metric: val_macro_f1
  save_best_mode: max
early_stopping:
  monitor: val_macro_f1
  mode: max
