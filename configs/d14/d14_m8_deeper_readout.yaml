inherits:
  - d14_m8_l002_extend100.yaml

run_name: d14_m8_deeper_readout

run:
  config_name: d14_m8_deeper_readout
  seed: 3

model:
  slot_self_attention_layers: 2
  slot_iters: 3
  slot_readout: self_attention_attention_pool
  dropout: 0.2
  projection_hidden_dim: 192

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00015

training:
  epochs: 80
  max_epochs: 80
  early_stopping_patience: 16

scheduler:
  name: cosine
  t_max: 80
  min_lr: 0.000001

d14:
  goal: increase M8 slot/readout capacity without changing the slot count
  performance_first: true
  evidence_gate_required: false

