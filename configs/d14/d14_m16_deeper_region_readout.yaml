inherits:
  - d14_m16_l005_extend100.yaml

run_name: d14_m16_deeper_region_readout

run:
  config_name: d14_m16_deeper_region_readout
  seed: 3

model:
  region_layers: 4
  region_encoder_layers: 4
  slot_self_attention_layers: 2
  slot_iters: 3
  dropout: 0.2
  projection_hidden_dim: 192

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00015

training:
  epochs: 80
  max_epochs: 80
  early_stopping_patience: 16

scheduler:
  name: cosine
  t_max: 80
  min_lr: 0.000001

d14:
  goal: increase M16 region/readout capacity while monitoring overfit and collapse
  performance_first: true
  evidence_gate_required: false

