inherits:
  - d14_m16_l005_extend100.yaml

run_name: d14_m16_l005_focal_or_class_weight

run:
  config_name: d14_m16_l005_focal_or_class_weight
  seed: 4

loss:
  lambda_supcon: 0.05
  use_class_weights: true
  class_counts: [3995, 436, 4097, 7215, 4830, 3171, 4965]
  class_weight_power: 0.50
  label_smoothing: 0.03

optimizer:
  name: adamw
  lr: 0.00005
  weight_decay: 0.0001

training:
  epochs: 80
  max_epochs: 80
  early_stopping_patience: 16

scheduler:
  name: cosine
  t_max: 80
  min_lr: 0.000001

d14:
  goal: strengthen class weighting for hard-class macro-F1 without adding new loss code
  performance_first: true
  evidence_gate_required: false

