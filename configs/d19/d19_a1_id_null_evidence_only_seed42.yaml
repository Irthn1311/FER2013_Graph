seed: 42
data:
  prior_dir: null
  evidence_dir: data
  batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
graph:
  graph_mode: evidence_only
  node_support_mode: stratified_detail_knn
  target_node_count: 1800
  bins: 6
  edge_schema: base6
  knn_edges:
    k: 6
    metric: standardized_euclidean
    feature_names:
    - intensity
    - gx
    - gy
    - grad_mag
    - local_mean_3x3
    - local_std_3x3
    - laplacian_abs
    - center_surround
  structure_edges:
    enabled: false
    max_nodes_per_group: 32
    targets_per_source: 4
    min_score: 0.05
    bidirectional: true
    relations:
    - - brow
      - eye
    - - eye
      - mouth
    - - nose_cheek
      - mouth
    - - mouth
      - nose_cheek
    - - eye
      - nose_cheek
    - - brow
      - mouth
    purification:
      enabled: false
      keep_ratio: 1.0
      mode: per_relation_or_per_source
  cache:
    enabled: false
    dir: null
    strict: true
    schema: d19_a0_evidence_only_v1
model:
  name: d18_structure_guided_pixel_gnn
  hidden_dim: 96
  num_classes: 7
  dropout: 0.2
  edge_context_gnn:
    num_layers: 3
    edge_attr_dim: 6
    edge_hidden_dim: 32
    dropout: 0.25
    residual: true
    layer_norm: true
    aggregation: mean
    scalar_edge_gate:
      enabled: false
  edge_type_conditioning:
    enabled: true
    mode: "null"
    num_types: 2
    embedding_dim: 8
    null_id: 0
    combine: concat
training:
  seed: 42
  max_epochs: 90
  batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  lr: 0.0003
  weight_decay: 0.001
  checkpoint_monitor: val_macro_f1
  checkpoint_monitor_mode: max
  final_test_checkpoint: best
  progress_interval_batches: 500
  amp: false
  allow_tf32: true
  drop_edge_p: 0.0
  early_stopping:
    enabled: true
    min_epochs_before_stop: 30
    patience: 15
    metric: val_loss
    mode: min
  scheduler:
    type: plateau
    monitor: val_loss
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 3.0e-05
  graph_regularization:
    drop_local_edge_p: 0.0
    drop_knn_edge_p: 0.0
    drop_structure_edge_p: 0.0
    structure_gate_penalty_lambda: 0.0
  structure_mode_mix:
    enabled: false
    p_forced_structure: 0.0
    p_zero_structure: 0.0
    approximation: remove_structure_edges_per_sample
logging:
  wandb:
    enabled: true
    project: lapgnn-d19-a1-id
    group: d19_a1_id_evidence_only
    mode: online
    resume: allow
    tags:
    - d19
    - a1-id
    - evidence-only
    - paired-control
    - d19_a1_id_null_evidence_only_seed42
run_name: d19_a1_id_null_evidence_only_seed42
output_dir: outputs/d19_runs/d19_a1_id_null_evidence_only_seed42
description: D19-A1-ID parameter-matched null-ID cell; all retained local and kNN edges condition on relation ID 0.
