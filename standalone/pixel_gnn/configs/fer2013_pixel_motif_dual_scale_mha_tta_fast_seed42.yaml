run_name: pixel_motif_dual_scale_mha_tta_fast_seed42
framework: tensorflow
seed: 42
from_scratch: true

model:
  name: pixel_motif_dual_scale
  hidden_dim: 96
  num_attention_layers: 3
  num_heads: 4
  num_motifs: 36
  spatial_span: 0.58
  use_motif_graph: true
  num_motif_gnn_layers: 2
  num_motif_heads: 4
  temperature: 0.1
  dropout: 0.15
  num_classes: 7

loss:
  mode: ce_only
  label_smoothing: 0.05
  lambda_motif_diversity: 0.05
  lambda_spatial_coherence: 0.02

augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  brightness_delta: 0.08
  contrast_range: [0.9, 1.1]

evaluation:
  use_tta: true

training:
  seed: 42
  max_epochs: 90
  batch_size: 128
  eval_batch_size: 128
  lr: 0.0003
  weight_decay: 0.001
  optimizer:
    type: adamw
    implementation: torch_compatible
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
    clipnorm: 5.0
  scheduler:
    type: cosine_warmup
    warmup_epochs: 3
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    min_epochs_before_stop: 30
    patience: 20
    metric: val_loss
    mode: min

paths:
  fer_csv: null
  output_root: /kaggle/working/outputs/pixel_motif_dual_scale_mha_tta
