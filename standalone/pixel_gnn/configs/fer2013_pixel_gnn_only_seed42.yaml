run_name: pixel_gnn_only_seed42
framework: tensorflow
seed: 42
from_scratch: true

model:
  name: pixel_gnn_only
  hidden_dim: 96
  gnn_layers: 3
  dropout: 0.2
  num_classes: 7
  edge_context_gnn:
    edge_attr_dim: 6
    edge_hidden_dim: 32
    dropout: 0.25

loss:
  mode: ce_only

training:
  seed: 42
  max_epochs: 90
  batch_size: 16
  eval_batch_size: 32
  lr: 0.0003
  weight_decay: 0.001
  optimizer:
    type: adamw
    implementation: torch_compatible
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
    clipnorm: 5.0
  scheduler:
    type: plateau
    monitor: val_loss
    mode: min
    factor: 0.5
    patience: 5
    threshold: 0.0001
    min_lr: 3.0e-05
  early_stopping:
    enabled: true
    min_epochs_before_stop: 30
    patience: 15
    metric: val_loss
    mode: min

paths:
  fer_csv: null
  output_root: outputs/pixel_gnn_only_seed42
