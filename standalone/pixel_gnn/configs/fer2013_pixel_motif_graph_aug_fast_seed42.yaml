run_name: pixel_motif_graph_aug_fast_seed42
framework: tensorflow
seed: 42
from_scratch: true

model:
  name: pixel_motif_graph
  hidden_dim: 64
  num_attention_layers: 2
  num_motifs: 32
  use_motif_graph: true
  num_motif_gnn_layers: 1
  temperature: 0.1
  pooling_type: motif
  dropout: 0.1
  num_classes: 7

loss:
  mode: ce_only
  lambda_motif_diversity: 0.05
  lambda_spatial_coherence: 0.02

augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  brightness_delta: 0.08
  contrast_range: [0.9, 1.1]

training:
  seed: 42
  max_epochs: 90
  batch_size: 128
  eval_batch_size: 128
  lr: 0.0003
  weight_decay: 0.001
  optimizer:
    type: adamw
    implementation: torch_compatible
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
    clipnorm: 5.0
  scheduler:
    type: cosine_warmup
    warmup_epochs: 3
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    min_epochs_before_stop: 30
    patience: 20
    metric: val_loss
    mode: min

paths:
  fer_csv: null
  output_root: /kaggle/working/outputs/pixel_motif_graph_aug
