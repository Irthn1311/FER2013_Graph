# Architectural ablation of the frozen TF seed42 reference, not Kaggle's batch32 variant.
extends: ../../lap_gnn_tensorflow_ofix7_mid_candidate/configs/fer2013_ofix7_mid_tensorflow_seed42.yaml
run_name: pixel_gnn_only_seed42
data:
  use_mediapipe_priors: false
  prior_dir: null
  graph_cache_dir: null
  graph_mode: full_pixel_grid
graph:
  graph_mode: full_pixel_grid
  node_features:
    features: [intensity, x_norm, y_norm, gx, gy]
  detail_features:
    enabled: false
  edge_features:
    features: [dx, dy, spatial_dist, abs_intensity_diff, abs_grad_mag_diff, abs_laplacian_diff]
  anchor_nodes:
    enabled: false
  knn_edges:
    enabled: false
  prior_corruption:
    enabled: false
model:
  name: pixel_gnn_only
  node_feature_dim: 5
  readout_type: global_mean
  encoder_type: shared_linear_gelu
  edge_context_gnn:
    edge_attr_dim: 6
    context_injection:
      enabled: false
  micro_motif_support: null
locked: null
logging:
  metrics: [train_loss, ce_loss, train_accuracy, train_macro_f1, train_eval_loss, val_loss, val_accuracy, val_macro_f1, test_from_best_val_accuracy, predictions, confusion_matrix, per_class_f1]
paths:
  output_root: /kaggle/working/outputs/pixel_gnn_only_seed42
